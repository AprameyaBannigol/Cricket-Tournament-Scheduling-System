
# Existing Scheduling Configuration
scheduling.search.maximum-search-nodes=100000
scheduling.search.maximum-duration-millis=10000
scheduling.search.maximum-candidate-assignments=500000
scheduling.search.maximum-generated-candidates=1000000

# PostgreSQL Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Session security. Set SESSION_COOKIE_SECURE=true behind HTTPS.
app.security.cookie-secure=${SESSION_COOKIE_SECURE:false}
app.security.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5174}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
